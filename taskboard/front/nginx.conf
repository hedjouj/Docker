# DNS interne Docker. Le nom "api" est résolu en continu (toutes les 10 s) :
# nginx suit l'ajout ou le retrait de réplicas (--scale) sans redémarrer.
resolver 127.0.0.11 valid=10s ipv6=off;

# Groupe de serveurs API : une entrée par réplica, requêtes réparties à tour de rôle.
# Le paramètre "resolve" nécessite nginx 1.27.3 ou plus récent.
upstream api_backend {
    zone api_backend 64k;
    server api:5000 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Sonde de santé du front, indépendante de l'API
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
