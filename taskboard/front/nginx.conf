server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # DNS interne Docker : "api" est résolu à chaque requête (TTL 10 s).
    # nginx démarre même si l'API n'est pas encore là, et suit l'ajout de réplicas (--scale).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:5000;

    # Sonde de santé du front, indépendante de l'API
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
