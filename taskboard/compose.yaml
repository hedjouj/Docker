name: taskboard

# Rotation des logs commune aux trois services (3 fichiers de 10 Mo max par conteneur)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskboard}
      POSTGRES_USER: ${POSTGRES_USER:-taskboard}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - back
    healthcheck:
      # -h 127.0.0.1 : le serveur temporaire de l'initialisation n'écoute pas en TCP, pas de faux "healthy"
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./api
      args:
        APP_VERSION: ${TASKBOARD_VERSION:-1.0.0}
    image: taskboard-api:${TASKBOARD_VERSION:-1.0.0}
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-taskboard}
      POSTGRES_USER: ${POSTGRES_USER:-taskboard}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - back
      - front
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  front:
    build:
      context: ./front
      args:
        APP_VERSION: ${TASKBOARD_VERSION:-1.0.0}
    image: taskboard-front:${TASKBOARD_VERSION:-1.0.0}
    ports:
      - "127.0.0.1:${FRONT_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - front
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  front:
  back:
    internal: true

volumes:
  db-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
